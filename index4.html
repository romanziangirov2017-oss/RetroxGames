<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Горячая картошка: Перезагрузка</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
    }
    html, body { height: 100%; }
    body {
        background: radial-gradient(circle at 50% 0%, #1b1b25 0%, #08080c 70%);
        color: #fff;
        font-family: 'Segoe UI', Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow: hidden;
        padding: 8px;
        touch-action: none;
    }
    #info {
        font-size: 16px;
        margin-bottom: 8px;
        text-align: center;
        min-height: 46px;
        max-width: 620px;
        font-weight: bold;
        color: #ff9f43;
        line-height: 1.35;
    }
    #game-wrapper {
        position: relative;
        width: 100%;
        max-width: 620px;
    }
    canvas {
        background-color: #14141c;
        border: 4px solid #2b2b3a;
        border-radius: 14px;
        display: block;
        width: 100%;
        height: auto;
        box-shadow: 0 10px 30px rgba(0,0,0,.75);
    }

    /* ---------- НИЖНЯЯ ПАНЕЛЬ (джойстик + кнопка) ---------- */
    #controls {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        max-width: 620px;
        margin-top: 10px;
    }
    #controls-right {
        margin-left: auto;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
        min-width: 0;
    }
    #active-buffs {
        font-size: 13px;
        color: #9aa0b0;
        line-height: 1.4;
        text-align: right;
        min-height: 18px;
    }
    button {
        padding: 12px 30px;
        font-size: 17px;
        background: linear-gradient(45deg, #ff9f43, #ff5252);
        color: #fff;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        font-weight: bold;
        letter-spacing: .3px;
        box-shadow: 0 4px 18px rgba(255,120,60,.45);
        transition: transform .12s ease;
        white-space: nowrap;
    }
    button:hover { transform: scale(1.05); }
    button:active { transform: scale(.97); }

    /* ---------- ДЖОЙСТИК: ВНЕ ИГРОВОГО ПОЛЯ ---------- */
    #joystick-zone {
        position: relative;
        width: 112px;
        height: 112px;
        flex-shrink: 0;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 45%, rgba(255,255,255,.12), rgba(255,255,255,.03) 70%);
        border: 2px solid rgba(255,255,255,.18);
        box-shadow: 0 0 22px rgba(0,0,0,.45) inset;
        display: none;
        touch-action: none;
    }
    #joystick-zone.active { display: block; }
    #joystick-stick {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 52px;
        height: 52px;
        margin: -26px 0 0 -26px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #ffd479, #ff9f43 60%, #e8761f);
        box-shadow: 0 5px 16px rgba(0,0,0,.6), inset 0 -4px 8px rgba(0,0,0,.28);
        pointer-events: none;
        will-change: transform;
    }

    /* на низких экранах (ландшафт телефона) всё компактнее */
    @media (max-height: 560px) {
        #info { display: none; }
        #game-wrapper { max-width: min(620px, 78vh); }
        #joystick-zone { width: 88px; height: 88px; }
        #joystick-stick { width: 42px; height: 42px; margin: -21px 0 0 -21px; }
        button { padding: 9px 20px; font-size: 15px; }
    }
</style>
</head>
<body>

<div id="info">Не дайте картошке взорваться у вас — передавайте её касанием!<br>Управление: WASD / стрелки / джойстик</div>

<div id="game-wrapper">
    <canvas id="game-canvas" width="600" height="400"></canvas>
</div>

<div id="controls">
    <div id="joystick-zone"><div id="joystick-stick"></div></div>
    <div id="controls-right">
        <div id="active-buffs"></div>
        <button id="start-btn">Старт</button>
    </div>
</div>

<script>
(() => {
'use strict';

/* ============================ БАЗА ============================ */
const canvas   = document.getElementById('game-canvas');
const ctx      = canvas.getContext('2d');
const infoEl   = document.getElementById('info');
const startBtn = document.getElementById('start-btn');
const joyZone  = document.getElementById('joystick-zone');
const joyStick = document.getElementById('joystick-stick');
const buffsEl  = document.getElementById('active-buffs');

const W = canvas.width;
const H = canvas.height;

const CFG = {
    playerSpeed:    3.5,   // игрок заметно быстрее ботов
    botSpeed:       2.5,
    botHolderBonus: 0.9,   // бот с картошкой догоняет игрока
    speedMul:       1.65,
    slowMul:        0.45,
    passCooldown:   16,
    buffSpeed:      300,
    buffFreeze:     120,
    itemMax:        3,
    itemInterval:   3500,
    roundMin:       10000,
    roundMax:       18000,
    fleeRadius:     220
};

const ICON = { speed: '⚡', shield: '🛡️', freeze: '🧊' };

const state = {
    players: [],
    items: [],
    particles: [],
    texts: [],
    potatoHolder: null,
    active: false,
    startTime: 0,
    roundLength: 14000,
    spawnTimer: null,
    endTimer: null,
    shake: 0,
    wins: 0,
    losses: 0
};

const keys = Object.create(null);
const JOY = { id: null, active: false, x: 0, y: 0, mag: 0 };

const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const rand  = (a, b) => a + Math.random() * (b - a);
const dist  = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    const r = clamp(((n >> 16) & 255) + amt, 0, 255);
    const g = clamp(((n >> 8) & 255) + amt, 0, 255);
    const b = clamp((n & 255) + amt, 0, 255);
    return `rgb(${r},${g},${b})`;
}

/* ============================ ВВОД ============================ */
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
    if (e.code === 'Space' && !state.active) initGame();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

/* ---- джойстик (фиксирован под полем) ---- */
function joyStart(e) {
    if (!state.active) return;
    e.preventDefault();
    JOY.id = e.pointerId;
    JOY.active = true;
    try { joyZone.setPointerCapture(e.pointerId); } catch (_) {}
    joyUpdate(e);
}
function joyUpdate(e) {
    if (!JOY.active || e.pointerId !== JOY.id) return;
    e.preventDefault();
    const r  = joyZone.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;
    const max = r.width / 2 - joyStick.offsetWidth / 2;

    let dx = e.clientX - cx;
    let dy = e.clientY - cy;
    const d = Math.hypot(dx, dy);
    if (d > max) { dx = dx / d * max; dy = dy / d * max; }

    joyStick.style.transform = `translate(${dx}px, ${dy}px)`;

    JOY.x = dx / max;
    JOY.y = dy / max;
    JOY.mag = Math.min(1, Math.hypot(JOY.x, JOY.y));
    if (JOY.mag < 0.18) { JOY.x = 0; JOY.y = 0; JOY.mag = 0; }
}
function joyEnd(e) {
    if (e.pointerId !== JOY.id) return;
    JOY.active = false;
    JOY.id = null;
    JOY.x = JOY.y = JOY.mag = 0;
    joyStick.style.transform = 'translate(0px, 0px)';
}
joyZone.addEventListener('pointerdown', joyStart);
joyZone.addEventListener('pointermove', joyUpdate);
joyZone.addEventListener('pointerup', joyEnd);
joyZone.addEventListener('pointercancel', joyEnd);
joyZone.addEventListener('lostpointercapture', joyEnd);

function resetJoystick() {
    JOY.active = false; JOY.id = null;
    JOY.x = JOY.y = JOY.mag = 0;
    joyStick.style.transform = 'translate(0px, 0px)';
}

/* ============================ ЭФФЕКТЫ ============================ */
function burst(x, y, color, count, power = 3) {
    for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = Math.random() * power + 0.6;
        state.particles.push({
            x, y,
            vx: Math.cos(a) * s,
            vy: Math.sin(a) * s,
            life: 1,
            decay: rand(0.018, 0.04),
            color,
            size: rand(1.8, 4.2)
        });
    }
}
function floatText(x, y, text, color) {
    state.texts.push({ x, y, text, color, life: 1 });
}

/* ============================ ПЕРСОНАЖ ============================ */
class Character {
    constructor({ x, y, color, name, isBot, speed }) {
        this.x = x;
        this.y = y;
        this.radius = 15;
        this.color = color;
        this.name = name;
        this.isBot = isBot;
        this.baseSpeed = speed;
        this.speed = speed;

        this.hasShield = false;
        this.speedTimer = 0;
        this.freezeTimer = 0;
        this.passCooldown = 0;

        this.wanderAngle = Math.random() * Math.PI * 2;
        this.dirX = 0;
        this.dirY = 0;
    }

    move(f) {
        if (this.speedTimer  > 0) this.speedTimer  = Math.max(0, this.speedTimer  - f);
        if (this.freezeTimer > 0) this.freezeTimer = Math.max(0, this.freezeTimer - f);
        if (this.passCooldown > 0) this.passCooldown = Math.max(0, this.passCooldown - f);

        let speed = this.baseSpeed;
        // бот с картошкой получает ускорение погони
        if (this.isBot && state.potatoHolder === this) speed += CFG.botHolderBonus;
        if (this.speedTimer  > 0) speed *= CFG.speedMul;
        if (this.freezeTimer > 0) speed *= CFG.slowMul;

        let mx, my;
        if (this.isBot) {
            const v = this.think();
            mx = v[0]; my = v[1];
        } else {
            mx = 0; my = 0;
            if (keys['KeyW'] || keys['ArrowUp'])    my -= 1;
            if (keys['KeyS'] || keys['ArrowDown'])  my += 1;
            if (keys['KeyA'] || keys['ArrowLeft'])  mx -= 1;
            if (keys['KeyD'] || keys['ArrowRight']) mx += 1;

            if (JOY.mag > 0.18) { mx = JOY.x; my = JOY.y; }

            const m = Math.hypot(mx, my);
            if (m > 1) { mx /= m; my /= m; }
        }

        this.dirX = mx;
        this.dirY = my;

        this.x = clamp(this.x + mx * speed * f, this.radius, W - this.radius);
        this.y = clamp(this.y + my * speed * f, this.radius, H - this.radius);
    }

    /* --- ИИ --- */
    think() {
        const holder = state.potatoHolder;
        let tx = this.x, ty = this.y, has = false;

        if (holder === this) {
            // с картошкой: целимся в игрока (или ближайшего)
            const human = state.players[0];
            let target = human;
            if (human && dist(human, this) > 420) {
                let best = null, bd = Infinity;
                for (const p of state.players) {
                    if (p === this) continue;
                    const d = dist(p, this);
                    if (d < bd) { bd = d; best = p; }
                }
                if (best) target = best;
            }
            if (target) { tx = target.x; ty = target.y; has = true; }
        } else if (holder) {
            // без картошки: убегаем от владельца (с «паникой»)
            const d = dist(this, holder);
            if (d < CFG.fleeRadius) {
                const nx = (this.x - holder.x) / (d || 1);
                const ny = (this.y - holder.y) / (d || 1);
                tx = this.x + nx * 160 + Math.cos(this.wanderAngle) * 55;
                ty = this.y + ny * 160 + Math.sin(this.wanderAngle) * 55;
                this.wanderAngle += rand(-0.07, 0.07);
                has = true;
            }
        }

        if (!has) {
            // ищем буст или бродим
            let best = null, bd = Infinity;
            for (const it of state.items) {
                const d = dist(it, this);
                if (d < bd) { bd = d; best = it; }
            }
            if (best && bd < 280) {
                tx = best.x; ty = best.y;
            } else {
                this.wanderAngle += rand(-0.25, 0.25);
                tx = this.x + Math.cos(this.wanderAngle) * 120;
                ty = this.y + Math.sin(this.wanderAngle) * 120;
            }
        }

        let dx = tx - this.x;
        let dy = ty - this.y;
        const d = Math.hypot(dx, dy) || 1;
        dx /= d; dy /= d;

        // отталкивание от стен
        const m = 55;
        if (this.x < m)     dx += (m - this.x) / m * 1.9;
        if (this.x > W - m) dx -= (this.x - (W - m)) / m * 1.9;
        if (this.y < m)     dy += (m - this.y) / m * 1.9;
        if (this.y > H - m) dy -= (this.y - (H - m)) / m * 1.9;

        dx += rand(-0.22, 0.22);
        dy += rand(-0.22, 0.22);

        const len = Math.hypot(dx, dy) || 1;
        return [dx / len, dy / len];
    }
}

/* ============================ БУСТЫ ============================ */
class BuffItem {
    constructor() {
        let x = 0, y = 0;
        for (let i = 0; i < 24; i++) {
            x = rand(35, W - 35);
            y = rand(35, H - 35);
            if (!state.players.some(p => Math.hypot(p.x - x, p.y - y) < 65)) break;
        }
        this.x = x;
        this.y = y;
        this.radius = 13;
        const types = ['speed', 'shield', 'freeze'];
        this.type = types[Math.floor(Math.random() * types.length)];
        this.phase = Math.random() * Math.PI * 2;
    }
}

function spawnItem() {
    if (!state.active) return;
    if (state.items.length < CFG.itemMax) state.items.push(new BuffItem());
}

/* ============================ ЛОГИКА ============================ */
function initGame() {
    clearInterval(state.spawnTimer);
    clearTimeout(state.endTimer);
    resetJoystick();

    state.players = [
        new Character({ x: 90,     y: H / 2,  color: '#00cbc6', name: 'Вы',   isBot: false, speed: CFG.playerSpeed }),
        new Character({ x: W - 90, y: 80,     color: '#ff5252', name: 'Bot1', isBot: true,  speed: CFG.botSpeed }),
        new Character({ x: W - 90, y: H - 80, color: '#10ac84', name: 'Bot2', isBot: true,  speed: CFG.botSpeed }),
        new Character({ x: W / 2,  y: H - 70, color: '#a55eea', name: 'Bot3', isBot: true,  speed: CFG.botSpeed })
    ];

    state.items = [];
    state.particles = [];
    state.texts = [];
    state.active = true;
    state.shake = 0;
    state.startTime = performance.now();
    state.roundLength = rand(CFG.roundMin, CFG.roundMax);
    state.potatoHolder = state.players[1 + Math.floor(Math.random() * 3)];
    state.potatoHolder.passCooldown = 30;

    startBtn.style.display = 'none';
    joyZone.classList.add('active');
    buffsEl.textContent = '';
    updateHolderText();

    spawnItem();
    spawnItem();
    state.spawnTimer = setInterval(spawnItem, CFG.itemInterval);
    state.endTimer   = setTimeout(endRound, state.roundLength);
}

function updateHolderText() {
    const h = state.potatoHolder;
    if (!h) return;
    if (h.isBot) {
        infoEl.innerHTML = `🔥 Картошка у <span style="color:${h.color}">${h.name}</span> — уклоняйтесь!`;
    } else {
        infoEl.innerHTML = `🔥 Картошка у <span style="color:#00cbc6">ВАС</span> — догоняйте бота и передавайте!`;
    }
}

function passPotato(from, to) {
    state.potatoHolder = to;
    to.passCooldown = CFG.passCooldown;

    const dx = to.x - from.x;
    const dy = to.y - from.y;
    const d = Math.hypot(dx, dy) || 1;

    to.x   = clamp(to.x   + (dx / d) * 14, to.radius, W - to.radius);
    to.y   = clamp(to.y   + (dy / d) * 14, to.radius, H - to.radius);
    from.x = clamp(from.x - (dx / d) * 10, from.radius, W - from.radius);
    from.y = clamp(from.y - (dy / d) * 10, from.radius, H - from.radius);

    burst(to.x, to.y, '#ff9f43', 14, 3.4);
    updateHolderText();
    if (!to.isBot) state.shake = 9;
}

function handlePassing() {
    const holder = state.potatoHolder;
    if (!holder) return;

    for (const p of state.players) {
        if (p === holder) continue;

        const dx = p.x - holder.x;
        const dy = p.y - holder.y;
        const d  = Math.hypot(dx, dy);
        // увеличенный радиус касания
        if (d >= p.radius + holder.radius + 5) continue;

        const nx = d > 0.001 ? dx / d : 1;
        const ny = d > 0.001 ? dy / d : 0;

        if (p.hasShield) {
            p.hasShield = false;
            holder.x = clamp(holder.x - nx * 52, holder.radius, W - holder.radius);
            holder.y = clamp(holder.y - ny * 52, holder.radius, H - holder.radius);
            holder.passCooldown = 20;
            burst(p.x, p.y, '#00d2d3', 16, 3.6);
            floatText(p.x, p.y - 26, 'ЩИТ!', '#00d2d3');
            continue;
        }

        if (holder.passCooldown > 0) continue;

        passPotato(holder, p);
        break;
    }
}

function applyBuff(p, item) {
    if (item.type === 'speed') {
        p.speedTimer = CFG.buffSpeed;
        floatText(p.x, p.y - 26, '⚡', '#ffd479');
    } else if (item.type === 'shield') {
        p.hasShield = true;
        floatText(p.x, p.y - 26, '🛡️', '#00d2d3');
    } else if (item.type === 'freeze') {
        state.players.forEach(o => { if (o !== p) o.freezeTimer = CFG.buffFreeze; });
        floatText(p.x, p.y - 26, '🧊', '#74b9ff');
    }
}

function handleItemPickups() {
    for (let i = state.items.length - 1; i >= 0; i--) {
        const it = state.items[i];
        for (const p of state.players) {
            if (Math.hypot(p.x - it.x, p.y - it.y) < p.radius + it.radius) {
                applyBuff(p, it);
                burst(it.x, it.y, '#f1c40f', 12, 2.8);
                state.items.splice(i, 1);
                break;
            }
        }
    }
}

function updateBuffsDisplay() {
    const h = state.players[0];
    if (!h) return;
    const parts = [];
    if (h.speedTimer > 0)  parts.push(`⚡ ${(h.speedTimer / 60).toFixed(1)}с`);
    if (h.hasShield)       parts.push('🛡️ Щит');
    if (h.freezeTimer > 0) parts.push('🧊 Замедление');
    buffsEl.textContent = parts.join('  •  ');
}

function endRound() {
    if (!state.active) return;
    state.active = false;

    clearInterval(state.spawnTimer);
    clearTimeout(state.endTimer);

    const holder = state.potatoHolder;
    burst(holder.x, holder.y, '#ff9f43', 40, 7);
    burst(holder.x, holder.y, '#ff5252', 30, 5);
    burst(holder.x, holder.y, '#ffe066', 20, 4);
    state.shake = 24;

    resetJoystick();
    joyZone.classList.remove('active');
    startBtn.style.display = 'block';
    startBtn.textContent = 'Ещё раз';

    if (holder.isBot) {
        state.wins++;
        infoEl.innerHTML =
            `💥 БУМ! Картошка взорвалась у <span style="color:${holder.color}">${holder.name}</span>.<br>` +
            `<span style="color:#2ecc71;font-size:23px">Вы ПОБЕДИЛИ! 🎉</span>`;
    } else {
        state.losses++;
        infoEl.innerHTML =
            `💥 БУМ! Картошка взорвалась у вас…<br>` +
            `<span style="color:#ff5252;font-size:23px">Вы ПРОИГРАЛИ! 😿</span>`;
    }
    buffsEl.textContent = `Побед: ${state.wins} • Поражений: ${state.losses} • Пробел — рестарт`;
}

/* ============================ ОБНОВЛЕНИЕ ============================ */
function update(dt) {
    const f = Math.min(dt / 16.667, 3);
    for (const p of state.players) p.move(f);
    handleItemPickups();
    handlePassing();
    state.shake = Math.max(0, state.shake - dt * 0.07);
    updateBuffsDisplay();
}

function updateParticles(dt) {
    const f = Math.min(dt / 16.667, 3);
    for (let i = state.particles.length - 1; i >= 0; i--) {
        const p = state.particles[i];
        p.x += p.vx * f;
        p.y += p.vy * f;
        p.vx *= 0.96;
        p.vy *= 0.96;
        p.vy += 0.05 * f;
        p.life -= p.decay * f;
        if (p.life <= 0) state.particles.splice(i, 1);
    }
    for (let i = state.texts.length - 1; i >= 0; i--) {
        const t = state.texts[i];
        t.y -= 0.7 * f;
        t.life -= 0.022 * f;
        if (t.life <= 0) state.texts.splice(i, 1);
    }
}

/* ============================ ОТРИСОВКА ============================ */
function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) { ctx.roundRect(x, y, w, h, r); return; }
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
}

function drawBackground(now) {
    ctx.fillStyle = '#14141c';
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = 'rgba(255,255,255,0.035)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 0; x <= W; x += 40) { ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, H); }
    for (let y = 0; y <= H; y += 40) { ctx.moveTo(0, y + 0.5); ctx.lineTo(W, y + 0.5); }
    ctx.stroke();

    if (state.active) {
        const t = clamp((now - state.startTime) / state.roundLength, 0, 1);
        const period = 260 - 150 * t;
        const pulse = 0.5 + 0.5 * Math.sin(now / period);
        const a = 0.05 + 0.26 * t * pulse;
        const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.28, W / 2, H / 2, H * 0.9);
        g.addColorStop(0, 'rgba(255,60,0,0)');
        g.addColorStop(1, `rgba(255,60,0,${a.toFixed(3)})`);
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
    }
}

function drawTimerBar(now) {
    if (!state.active) return;
    const left = 1 - clamp((now - state.startTime) / state.roundLength, 0, 1);
    const x = 20, y = 14, h = 8, barW = W - 40;

    ctx.fillStyle = 'rgba(0,0,0,.5)';
    roundRect(x, y, barW, h, 4); ctx.fill();

    ctx.fillStyle = left > 0.5 ? '#2ecc71' : left > 0.25 ? '#ff9f43' : '#ff5252';
    roundRect(x, y, Math.max(0, barW * left), h, 4); ctx.fill();
}

function drawItem(it, now) {
    const pulse = 1 + Math.sin(now / 240 + it.phase) * 0.09;
    ctx.save();
    ctx.shadowColor = '#f1c40f';
    ctx.shadowBlur = 16;
    ctx.beginPath();
    ctx.arc(it.x, it.y, it.radius * pulse, 0, Math.PI * 2);
    ctx.fillStyle = '#f1c40f';
    ctx.fill();
    ctx.restore();

    ctx.beginPath();
    ctx.arc(it.x, it.y, it.radius * pulse, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,.85)';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.font = '15px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#111';
    ctx.fillText(ICON[it.type], it.x, it.y + 1);
    ctx.textBaseline = 'alphabetic';
}

function drawCharacter(c, now) {
    const isHolder = c === state.potatoHolder;

    if (isHolder) {
        const pulse = 0.6 + 0.4 * Math.sin(now / 110);
        const g = ctx.createRadialGradient(c.x, c.y, c.radius, c.x, c.y, c.radius + 34);
        g.addColorStop(0, `rgba(255,120,0,${(0.5 * pulse).toFixed(3)})`);
        g.addColorStop(1, 'rgba(255,120,0,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.radius + 34, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.beginPath();
    ctx.ellipse(c.x, c.y + c.radius + 5, c.radius * 0.85, 4.5, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,.38)';
    ctx.fill();

    if (c.hasShield) {
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.radius + 8, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(0,210,211,.95)';
        ctx.lineWidth = 3;
        ctx.setLineDash([8, 6]);
        ctx.lineDashOffset = -now / 40;
        ctx.stroke();
        ctx.setLineDash([]);
    }

    const grad = ctx.createRadialGradient(
        c.x - c.radius * 0.35, c.y - c.radius * 0.35, c.radius * 0.15,
        c.x, c.y, c.radius
    );
    grad.addColorStop(0, shade(c.color, 70));
    grad.addColorStop(1, c.color);

    ctx.beginPath();
    ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(0,0,0,.35)';
    ctx.stroke();

    const ex = c.dirX * 3, ey = c.dirY * 3;
    ctx.fillStyle = 'rgba(255,255,255,.92)';
    ctx.beginPath(); ctx.arc(c.x - 5 + ex, c.y - 3 + ey, 3.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(c.x + 5 + ex, c.y - 3 + ey, 3.4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.arc(c.x - 5 + ex * 1.4, c.y - 3 + ey * 1.4, 1.6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(c.x + 5 + ex * 1.4, c.y - 3 + ey * 1.4, 1.6, 0, Math.PI * 2); ctx.fill();

    if (c.freezeTimer > 0) {
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(116,185,255,.45)';
        ctx.fill();
    }

    if (isHolder) {
        const bob = Math.sin(now / 150) * 3;
        ctx.font = '22px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('🥔', c.x, c.y - c.radius - 14 + bob);
        ctx.font = '14px Arial';
        ctx.fillText('🔥', c.x - 15, c.y - c.radius - 16 + bob);
    }

    ctx.font = 'bold 12px Arial';
    ctx.textAlign = 'center';
    const tw = ctx.measureText(c.name).width;
    const py = c.y + c.radius + 9;
    ctx.fillStyle = 'rgba(0,0,0,.5)';
    roundRect(c.x - tw / 2 - 6, py, tw + 12, 16, 8);
    ctx.fill();
    ctx.fillStyle = c.isBot ? '#d6d6e0' : '#7fffd4';
    ctx.fillText(c.name, c.x, py + 12);
}

function drawParticles() {
    for (const p of state.particles) {
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

function drawTexts() {
    ctx.textAlign = 'center';
    ctx.font = 'bold 16px Arial';
    for (const t of state.texts) {
        ctx.globalAlpha = Math.max(0, t.life);
        ctx.fillStyle = t.color;
        ctx.fillText(t.text, t.x, t.y);
    }
    ctx.globalAlpha = 1;
}

function render(now) {
    ctx.save();
    if (state.shake > 0.4) {
        ctx.translate(
            (Math.random() - 0.5) * state.shake,
            (Math.random() - 0.5) * state.shake
        );
    }

    drawBackground(now);
    for (const it of state.items) drawItem(it, now);
    for (const p of state.players) drawCharacter(p, now);
    drawParticles();
    drawTexts();

    ctx.restore();
    drawTimerBar(now);
}

/* ============================ ЦИКЛ ============================ */
let lastTime = performance.now();

function loop(now) {
    const dt = Math.min(now - lastTime, 60);
    lastTime = now;

    if (state.active) update(dt);
    updateParticles(dt);
    render(now);

    requestAnimationFrame(loop);
}

startBtn.addEventListener('click', initGame);
requestAnimationFrame(loop);

})();
</script>
</body>
