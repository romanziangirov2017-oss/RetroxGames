<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Фан-архив лора Devil May Cry: игры, манга, новеллы, персонажи и аниме.">
    <title>Devil May Cry: Lore Archive</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=MedievalSharp&family=Roboto:wght@300;400;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Roboto', sans-serif;
            min-height: 100vh;
            overflow-x: clip;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(139, 0, 0, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 50%, rgba(0, 0, 139, 0.1) 0%, transparent 50%);
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><path d="M50 0 L60 40 L100 50 L60 60 L50 100 L40 60 L0 50 L40 40 Z" fill="rgba(139,0,0,0.03)"/></svg>');
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        header { text-align: center; padding: 40px 0 20px; position: relative; }

        h1 {
            font-family: 'MedievalSharp', cursive;
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            color: #cc0000;
            text-shadow:
                0 0 20px rgba(204, 0, 0, 0.5),
                0 0 40px rgba(204, 0, 0, 0.3),
                0 0 80px rgba(204, 0, 0, 0.1);
            letter-spacing: 4px;
            animation: pulseGlow 3s ease-in-out infinite alternate;
            line-height: 1.2;
        }

        h1 span {
            display: block;
            font-size: 0.4em;
            color: #888;
            letter-spacing: 12px;
            text-shadow: none;
            font-family: 'Roboto', sans-serif;
            font-weight: 300;
            margin-top: 5px;
        }

        @keyframes pulseGlow {
            from { text-shadow: 0 0 20px rgba(204, 0, 0, 0.5), 0 0 40px rgba(204, 0, 0, 0.3); }
            to   { text-shadow: 0 0 30px rgba(204, 0, 0, 0.8), 0 0 60px rgba(204, 0, 0, 0.5), 0 0 100px rgba(204, 0, 0, 0.2); }
        }

        .subtitle {
            color: #666;
            font-size: 0.9rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-top: 10px;
        }

        .category-nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .cat-btn {
            background: linear-gradient(135deg, #1a1a1a, #0d0d0d);
            border: 1px solid #333;
            color: #aaa;
            padding: 12px 30px;
            font-size: 1rem;
            font-family: 'MedievalSharp', cursive;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
            clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%);
        }

        .cat-btn:hover,
        .cat-btn.active {
            border-color: #cc0000;
            color: #fff;
            background: linear-gradient(135deg, #2a0000, #1a0000);
            box-shadow: 0 0 20px rgba(204, 0, 0, 0.3);
        }

        .cat-btn:focus-visible { outline: 2px solid #cc0000; outline-offset: 3px; }

        .cat-btn.active::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 2px;
            background: #cc0000;
            box-shadow: 0 0 10px #cc0000;
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            padding: 20px 0;
        }

        .item-card {
            display: block;
            width: 100%;
            background: linear-gradient(145deg, #111 0%, #0a0a0a 100%);
            border: 1px solid #222;
            padding: 25px 20px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            clip-path: polygon(0 0, 100% 0, 100% 85%, 95% 100%, 0 100%);
            font-family: inherit;
            font-size: inherit;
            color: inherit;
            text-align: left;
            appearance: none;
            -webkit-appearance: none;
            animation: cardIn 0.45s ease both;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .item-card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(204, 0, 0, 0.05), transparent);
            transition: left 0.6s ease;
        }

        .item-card:hover::before,
        .item-card:focus-visible::before { left: 100%; }

        .item-card:hover,
        .item-card:focus-visible {
            border-color: #cc0000;
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 10px 40px rgba(204, 0, 0, 0.2);
            outline: none;
        }

        .item-card:focus-visible { outline: 2px solid #cc0000; outline-offset: 3px; }

        .item-card .card-icon {
            font-size: 2rem;
            margin-bottom: 12px;
            display: block;
            filter: drop-shadow(0 0 8px rgba(204, 0, 0, 0.5));
        }

        .item-card h3 {
            font-family: 'MedievalSharp', cursive;
            font-size: 1.3rem;
            color: #cc0000;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .item-card p { color: #777; font-size: 0.85rem; line-height: 1.5; }

        .item-card .tag {
            display: inline-block;
            margin-top: 12px;
            padding: 4px 12px;
            border: 1px solid #333;
            font-size: 0.7rem;
            color: #888;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .modal-overlay.active { visibility: visible; opacity: 1; }

        .modal-content {
            background: linear-gradient(145deg, #151515, #0a0a0a);
            border: 1px solid #cc0000;
            max-width: 800px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 40px;
            position: relative;
            box-shadow: 0 0 60px rgba(204, 0, 0, 0.2);
            clip-path: polygon(0 0, 100% 0, 100% 95%, 98% 100%, 0 100%);
            animation: modalIn 0.4s ease;
        }

        @keyframes modalIn {
            from { transform: scale(0.9) translateY(30px); opacity: 0; }
            to   { transform: scale(1) translateY(0); opacity: 1; }
        }

        .modal-content::-webkit-scrollbar { width: 6px; }
        .modal-content::-webkit-scrollbar-track { background: #0a0a0a; }
        .modal-content::-webkit-scrollbar-thumb { background: #cc0000; border-radius: 3px; }

        .modal-close {
            position: absolute;
            top: 15px; right: 20px;
            background: none;
            border: 1px solid #333;
            color: #888;
            font-size: 1.5rem;
            width: 40px;
            height: 40px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Roboto', sans-serif;
        }

        .modal-close:hover,
        .modal-close:focus-visible {
            border-color: #cc0000;
            color: #cc0000;
            transform: rotate(90deg);
            outline: none;
        }

        .modal-content h2 {
            font-family: 'MedievalSharp', cursive;
            color: #cc0000;
            font-size: 2rem;
            margin-bottom: 5px;
            letter-spacing: 2px;
            padding-right: 50px;
        }

        .modal-content .modal-subtitle {
            color: #666;
            font-size: 0.8rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #222;
        }

        .modal-content .story-text {
            color: #bbb;
            line-height: 1.8;
            font-size: 0.95rem;
        }

        .modal-content .story-text p {
            margin-bottom: 15px;
            text-align: justify;
        }

        .modal-content .story-text .highlight { color: #cc0000; font-weight: 700; }

        .modal-content .story-text .quote {
            border-left: 3px solid #cc0000;
            padding-left: 15px;
            margin: 20px 0;
            color: #999;
            font-style: italic;
        }

        footer {
            text-align: center;
            padding: 40px 0 20px;
            color: #333;
            font-size: 0.75rem;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        @media (max-width: 600px) {
            .modal-content { padding: 25px 20px; }
            .modal-content h2 { font-size: 1.5rem; }
            .items-grid { grid-template-columns: 1fr; }
            h1 { letter-spacing: 2px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Devil May Cry<span>Lore Archive</span></h1>
            <p class="subtitle">Хроники охотника на демонов</p>
        </header>

        <nav class="category-nav">
            <button class="cat-btn active" data-category="games">ИГРЫ (1–5)</button>
            <button class="cat-btn" data-category="manga">МАНГА</button>
            <button class="cat-btn" data-category="novels">НОВЕЛЛЫ</button>
            <button class="cat-btn" data-category="characters">ПЕРСОНАЖИ</button>
            <button class="cat-btn" data-category="anime">АНИМЕ</button>
        </nav>

        <div class="items-grid" id="itemsGrid"></div>

        <footer>Devil May Cry &copy; Capcom | Fan-made Lore Archive</footer>
    </div>

    <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-content">
            <button class="modal-close" id="modalClose" aria-label="Закрыть">&times;</button>
            <h2 id="modalTitle"></h2>
            <div class="modal-subtitle" id="modalSubtitle"></div>
            <div class="story-text" id="modalStory"></div>
        </div>
    </div>

    <script>
        const loreData = {
            games: [
                {
                    id: 'dmc1', icon: '🗡️', title: 'Devil May Cry', year: '2001', tag: 'PlayStation 2',
                    subtitle: 'Начало легенды',
                    story: `
                        <p>Данте — <span class="highlight">получеловек-полудемон</span>, сын легендарного Тёмного Рыцаря Спарды, который много веков назад изгнал Владыку Тьмы Мундуса в подземный мир. Данте владеет частным агентством по истреблению демонов, и однажды получает загадочное приглашение от женщины по имени <span class="highlight">Триш</span> — отправиться на остров Маллет и сразиться с Мундусом.</p>
                        <p>Мундус, пробуждаясь, посылает своих слуг уничтожить Данте. Пробиваясь через орды демонов, Данте попадает в огромный замок, где сталкивается со своим братом <span class="highlight">Вергилием</span>, превращённым в демона Нело Анджело. Тяжкая участь брата наполняет душу Данте раскаянием и яростью.</p>
                        <p>В финальной битве против Мундуса Данте использует силу истинного Сына Спарды. Триш, изначально созданная Мундусом как приманка, встаёт на сторону Данте, и вместе они одерживают победу. Мундус запечатан, но Данте теряет брата — и обретает верного союзника в лице Триш, которая становится его напарницей.</p>
                        <div class="quote">«Я — Данте, сын Спарды. И я здесь, чтобы отправить тебя обратно в ад.»</div>
                    `
                },
                {
                    id: 'dmc2', icon: '🌑', title: 'Devil May Cry 2', year: '2003', tag: 'PlayStation 2',
                    subtitle: 'Тени прошлого',
                    story: `
                        <p>События разворачиваются в городе <span class="highlight">Вьё-де-Марли</span>. Данте получает заказ на поиск таинственной печати, которая может открыть врата между миром людей и демонов. В этом ему помогает <span class="highlight">Люсия</span> — член клана хранителей с демонической кровью.</p>
                        <p>Их противник — безумный бизнесмен <span class="highlight">Ариус</span>, который стремится освободить демоническое божество <span class="highlight">Аргосака</span>. Люсия играет ключевую роль в противостоянии, а Данте, объединив с ней усилия, останавливает Ариуса и сражается с Аргосаксом в финальной битве.</p>
                        <p>После победы Данте отправляется в измерение демонов, оставляя Люсии свой меч и монету — символ того, что он вернётся. Эта часть часто считается самой мрачной и философской в серии, исследующей тему одиночества и предназначения.</p>
                        <div class="quote">«Демоны не плачут. Но иногда... даже они чувствуют боль.»</div>
                    `
                },
                {
                    id: 'dmc3', icon: '🔥', title: "Devil May Cry 3: Dante's Awakening", year: '2005', tag: 'PlayStation 2',
                    subtitle: 'Пробуждение',
                    story: `
                        <p>Хронологически первая часть серии. Молодой Данте, ещё не открывший агентство, получает визит таинственного <span class="highlight">Аркхама</span> — учёного-демонолога, который убил свою жену. Аркхам сообщает Данте, что его брат <span class="highlight">Вергилий</span> строит башню <span class="highlight">Темен-ни-гру</span>, чтобы получить силу Спарды.</p>
                        <p>Данте отправляется остановить брата. В башне он встречает <span class="highlight">Леди</span> — дочь Аркхама, которая охотится на собственного отца. Братья сражаются несколько раз: их конфликт строится на противоположных жизненных целях — Вергилий стремится к абсолютной силе, Данте — к защите человечества.</p>
                        <p>Аркхам предаёт Вергилия и забирает силу Спарды себе, но объединёнными усилиями Данте, Вергилий и Леди побеждают его. В финале Вергилий уходит в портал между мирами, где проигрывает Мундусу и становится его рабом — Нело Анджело. Данте остаётся в мире людей, открывает агентство «Devil May Cry» и начинает свой путь охотника на демонов.</p>
                        <div class="quote">«Сила — это всё. Без силы ты ничто. Без силы ты не можешь защитить даже то, что тебе дорого.» — Вергилий</div>
                    `
                },
                {
                    id: 'dmc4', icon: '⚔️', title: 'Devil May Cry 4', year: '2008', tag: 'PlayStation 3 / Xbox 360',
                    subtitle: 'Орден Меча',
                    story: `
                        <p>Действие происходит на острове <span class="highlight">Фортуна</span>, где правит Орден Меча. Главный герой — <span class="highlight">Неро</span>, молодой рыцарь Ордена, обладающий демонической рукой <span class="highlight">Devil Bringer</span>. Во время фестиваля Ордена <span class="highlight">Данте</span> убивает Верховного Жреца Санктуса на глазах у Неро, и Неро отправляется в погоню.</p>
                        <p>Постепенно раскрывается истинная суть Ордена: Санктус стремится использовать силу Спарды для создания <span class="highlight">Спасителя</span> — гигантской статуи-оружия. Неро узнаёт, что его рука — наследие Вергилия, его истинного отца. Данте и Неро объединяются, чтобы остановить Санктуса.</p>
                        <p>Неро освобождает Кирие, свою возлюбленную, и уничтожает Санктуса. Данте забирает Ямато — меч Вергилия — и передаёт его Неро, признавая его силу. Неро остаётся защитником Фортуны, а Данте возвращается в своё агентство.</p>
                        <div class="quote">«Я не собираюсь быть как ты. Я сам решу, каким мне быть.» — Неро</div>
                    `
                },
                {
                    id: 'dmc-reboot', icon: '🌀', title: 'DmC: Devil May Cry', year: '2013', tag: 'PS3 / Xbox 360 / PC',
                    subtitle: 'Перезапуск',
                    story: `
                        <p><span class="highlight">DmC: Devil May Cry</span> — перезапуск серии, разработанный студией <span class="highlight">Ninja Theory</span> и изданный Capcom в 2013 году. Действие происходит в совершенно новой вселенной, не связанной с предыдущими играми.</p>
                        <p>Главный герой — <span class="highlight">Данте</span>, <span class="highlight">напфилим</span> (гибрид ангела и демона), который не помнит своего прошлого. Он скрывается от демонов в мире людей, пока его не находит <span class="highlight">Кэт</span> и не приводит в организацию «Орден» к своему брату <span class="highlight">Вергилию</span>.</p>
                        <p>Выясняется, что 9000 лет назад демон <span class="highlight">Мундус</span> победил в войне, а отец Данте — демон <span class="highlight">Спарда</span> — полюбил ангела <span class="highlight">Еву</span>, и у них родились близнецы. Мундус убил Еву, и теперь Данте стремится отомстить, но постепенно задумывается, за что именно он сражается.</p>
                        <p>Ключевая особенность — измерение <span class="highlight">Лимбо</span>, параллельная реальность, отражающая мир людей, которая постоянно разрушается и атакует Данте. Демоны могут в любой момент затянуть его туда.</p>
                        <div class="quote">«Меня зовут Данте. И я не тот, кем ты меня считаешь.»</div>
                    `
                },
                {
                    id: 'dmc5', icon: '🌳', title: 'Devil May Cry 5', year: '2019', tag: 'PS4 / Xbox One / PC',
                    subtitle: 'Королевская битва',
                    story: `
                        <p>Прошло несколько лет после событий DMC4. <span class="highlight">Неро</span> лишается демонической руки — её отрубает таинственный незнакомец. Тем временем <span class="highlight">Данте</span> получает заказ от загадочного мужчины по имени <span class="highlight">V</span> на уничтожение демона, которого тот называет «твоя причина».</p>
                        <p>Все трое — Данте, Неро и V — сходятся в <span class="highlight">Редгрейв-Сити</span>, над которым вырос демонический <span class="highlight">Древо Клифот</span>, высасывающее кровь людей. Выясняется, что незнакомец, отрубивший руку Неро, — это <span class="highlight">Уризен</span>, демоническая половина Вергилия, отделившаяся от него с помощью Ямато. V — человеческая половина Вергилия, его совесть и слабость.</p>
                        <p>Вергилий разделил себя, чтобы избавиться от человеческих слабостей и обрести силу. Данте сражается с Уризеном, Неро — с Вергилием. В финале братья Данте и Вергилий объединяются, чтобы срубить Древо Клифот и закрыть портал в мир демонов. Они остаются в аду, а Неро, Люсия и Триш продолжают защищать мир людей.</p>
                        <div class="quote">«Я — V. Я — то, что осталось от Вергилия. Его человеческая часть... его слабость.»</div>
                    `
                }
            ],
            manga: [
                {
                    id: 'vov', icon: '📖', title: 'Devil May Cry 5: Visions of V', year: '2019–2021', tag: 'Манга / 5 томов',
                    subtitle: 'Глазами V',
                    story: `

        const itemsGrid = document.getElementById('itemsGrid');

        const modalTitle = document.getElementById('modalTitle');
        const modalSubtitle = document.getElementById('modalSubtitle');
        const modalStory = document.getElementById('modalStory');
        const modalClose = document.getElementById('modalClose');

        let lastFocusedElement = null;

        function renderItems(category) {
            const items = loreData[category] || [];
            itemsGrid.innerHTML = '';

            items.forEach((item, index) => {
                const card = document.createElement('button');
                card.type = 'button';
                card.className = 'item-card';
                card.style.animationDelay = `${index * 0.04}s`;
                card.innerHTML = `
                    <span class="card-icon">${item.icon}</span>
                    <h3>${item.title}</h3>
                    <p>${item.subtitle}</p>
                    <span class="tag">${item.year} · ${item.tag}</span>
                `;
                card.addEventListener('click', () => openModal(item, card));
                itemsGrid.appendChild(card);
            });

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function openModal(item, trigger) {
            lastFocusedElement = trigger || null;
            modalTitle.textContent = item.title;
            modalSubtitle.textContent = `${item.year} · ${item.tag}`;
            modalStory.innerHTML = item.story;
            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
            modalClose.focus();
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = '';
            if (lastFocusedElement) {
                lastFocusedElement.focus();
                lastFocusedElement = null;
            }
        }

        document.querySelectorAll('.cat-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderItems(btn.dataset.category);
            });
        });

        modalClose.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modalOverlay.classList.contains('active')) closeModal();
            if (e.key === 'Tab' && modalOverlay.classList.contains('active')) {
                const focusable = modalOverlay.querySelectorAll('button, [href], input, [tabindex]:not([tabindex="-1"])');
                if (!focusable.length) return;
                const first = focusable[0];
                const last = focusable[focusable.length - 1];
                if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
                else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
            }
        });

        renderItems('games');
    </script>
